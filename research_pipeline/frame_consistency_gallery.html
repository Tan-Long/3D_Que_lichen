<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pilot vỏ kép · Mesh viewer</title>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/loaders/PLYLoader.js":"/vendor/three/PLYLoader.js","three/addons/controls/OrbitControls.js":"/vendor/three/OrbitControls.js"}}</script>
  <style>
    :root{color-scheme:dark;--bg:#0b0e0d;--panel:#121715;--raised:#19201c;--line:#2b352f;--text:#eff4f1;--secondary:#b4bfb8;--muted:#7f8b84;--accent:#9ece8f;--bad:#e28a72}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}
    header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font:650 11px ui-monospace,monospace;letter-spacing:.09em;text-transform:uppercase}h1{margin:4px 0 0;font-size:20px}.hint{color:var(--muted)}
    main{height:calc(100% - 72px);display:grid;grid-template-columns:290px minmax(0,1fr)}aside{background:var(--panel);border-right:1px solid var(--line);padding:12px}.intro{padding:4px 5px 14px;color:var(--secondary)}.sample{width:100%;padding:12px;margin-bottom:6px;color:var(--secondary);background:transparent;border:1px solid transparent;border-radius:8px;text-align:left;cursor:pointer}.sample:hover,.sample[aria-current=true]{color:var(--text);background:var(--raised)}.sample[aria-current=true]{border-color:#4c5b53}.sample strong{font:650 13px ui-monospace,monospace}.sample span{float:right;color:var(--muted)}
    .viewer{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 42%,#202821 0,#101411 48%,#090b0a 100%)}canvas{display:block;width:100%;height:100%;touch-action:none}.panel{position:absolute;top:16px;left:16px;width:min(650px,calc(100% - 190px));padding:14px;background:rgb(12 15 14/.88);border:1px solid var(--line);border-radius:9px;backdrop-filter:blur(10px)}h2{margin:0;font:650 15px ui-monospace,monospace}.verdict{margin:5px 0 10px;color:var(--secondary);font-size:12px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{padding:5px 7px;border-top:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left;color:var(--secondary)}th{color:var(--muted);font-size:11px}.active{color:var(--accent)}
    .toolbar{position:absolute;top:16px;right:16px;display:flex;gap:7px}.modes{position:absolute;left:16px;bottom:16px;display:flex;gap:7px;padding:6px;background:rgb(12 15 14/.9);border:1px solid var(--line);border-radius:9px}.control{min-height:40px;padding:8px 11px;color:var(--secondary);background:rgb(12 15 14/.88);border:1px solid var(--line);border-radius:7px;cursor:pointer}.control:hover{color:var(--text);border-color:#536158}.control[aria-pressed=true]{color:var(--accent);border-color:var(--accent);background:var(--raised)}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--secondary);background:rgb(9 11 10/.68);pointer-events:none}.loading[hidden]{display:none}.error{color:var(--bad)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  </style>
</head>
<body>
  <header><div><div class="eyebrow">TSDF · Double-shell pilot</div><h1>So sánh lọc đồng thuận frame</h1></div><div class="hint">↑/↓ đổi mẫu · B baseline · 1 ngưỡng 0,55 · 2 ngưỡng 0,40</div></header>
  <main><aside><div class="intro">Ba mẫu pilot. Không output nào đã thay production.</div><nav id="list"></nav></aside>
    <section class="viewer" id="viewer"><div class="panel"><h2 id="title">Đang tải…</h2><div class="verdict" id="verdict"></div><table><thead><tr><th>Metric</th><th>Baseline</th><th>0,55</th><th>0,40</th></tr></thead><tbody id="metrics"></tbody></table></div>
      <div class="toolbar"><button class="control" id="rotate" aria-pressed="true">Đang xoay</button><button class="control" id="reset">Đặt lại góc</button></div>
      <div class="modes"><button class="control" data-mode="baseline">B · Baseline</button><button class="control" data-mode="min55">1 · 0,55</button><button class="control" data-mode="min40" aria-pressed="true">2 · 0,40</button></div><div class="loading" id="loading">Đang tải mesh…</div>
    </section>
  </main>
  <script type="module">
    import * as THREE from 'three';import{PLYLoader}from'three/addons/loaders/PLYLoader.js';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
    const samples=[
      {name:'26Q90',uid:'legacy-26q90-fab2ebbc',verdict:'0,40 cải thiện một phần nhưng TOP vẫn còn hai lớp.'},
      {name:'26Q20',uid:'legacy-26q20-3d0067ea',verdict:'Cả hai ngưỡng làm mất coverage; giữ baseline.'},
      {name:'cay_0029_1805',uid:'new-cay-0029-1805-2bd07490',verdict:'0,55 tự fallback; 0,40 làm mất coverage.'}
    ].map(s=>({...s,baseline:`/artifacts/meshes_all/${s.uid}/tensor_v5mm_step3_conf1_adaptive_r35`,min55:`/artifacts/frame_consistency_pilot/${s.uid}/tensor_v5mm_step3_conf1_adaptive_r35_consistency_v1`,min40:`/artifacts/frame_consistency_pilot/${s.uid}/tensor_v5mm_step3_conf1_adaptive_r35_consistency_v2_min40`}));
    let selected=0,mode='min40',mesh=null,token=0;const viewer=document.querySelector('#viewer'),loading=document.querySelector('#loading'),loader=new PLYLoader();
    const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(36,1,.001,1000),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;viewer.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xeaf4ec,0x314038,2.2));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(3,4,5);scene.add(key);const rim=new THREE.DirectionalLight(0xa5d6a7,1.4);rim.position.set(-4,2,-3);scene.add(rim);scene.add(new THREE.GridHelper(4,20,0x526159,0x27302b));const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=!matchMedia('(prefers-reduced-motion:reduce)').matches;controls.autoRotateSpeed=1.15;
    const fmt=(v,d=1)=>v==null?'—':Number(v).toFixed(d),pct=v=>v==null?'—':`${fmt(v*100,1)}%`;
    function renderList(){document.querySelector('#list').innerHTML=samples.map((s,i)=>`<button class="sample" data-index="${i}" aria-current="${i===selected}"><strong>${s.name}</strong><span>›</span></button>`).join('')}
    function rows(all){const fields=[['Hit',d=>pct(d.heldout_depth?.mesh_hit_fraction)],['Residual P90',d=>`${fmt((d.heldout_depth?.absolute_residual_p90_m||0)*1000,2)} mm`],['Within 20 mm',d=>pct(d.heldout_depth?.within_20mm_fraction)],['Boundary edge',d=>fmt(d.mesh?.boundary_edges,0)],['Azimuth P10',d=>pct(d.mesh?.azimuth_coverage_p10)]];document.querySelector('#metrics').innerHTML=fields.map(([label,get])=>`<tr><td>${label}</td>${['baseline','min55','min40'].map(k=>`<td class="${k===mode?'active':''}">${get(all[k])}</td>`).join('')}</tr>`).join('')}
    function compatible(g){for(const n of['position','normal']){const a=g.getAttribute(n);if(a?.array instanceof Float64Array)g.setAttribute(n,new THREE.Float32BufferAttribute(a.array,a.itemSize,a.normalized))}return g}
    function frame(g){g.computeBoundingBox();const c=new THREE.Vector3(),size=new THREE.Vector3();g.boundingBox.getCenter(c);g.boundingBox.getSize(size);g.translate(-c.x,-c.y,-c.z);g.computeBoundingSphere();const r=Math.max(g.boundingSphere.radius,.01),d=r/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.08;camera.near=Math.max(r/1000,.0001);camera.far=r*100;camera.position.set(d*.72,r*.18,d*.72);camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.minDistance=r*.35;controls.maxDistance=r*8;controls.update()}
    async function load(){const id=++token,s=samples[selected],path=s[mode];loading.hidden=false;loading.textContent='Đang tải mesh…';loading.classList.remove('error');document.querySelector('#title').textContent=`${s.name} · ${mode==='baseline'?'Baseline':mode==='min55'?'Ngưỡng 0,55':'Ngưỡng 0,40'}`;document.querySelector('#verdict').textContent=s.verdict;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));renderList();try{const [baseline,min55,min40,g]=await Promise.all(['baseline','min55','min40'].map(k=>fetch(`${s[k]}/metrics.json`).then(r=>{if(!r.ok)throw Error(k);return r.json()})).concat(new Promise((ok,no)=>loader.load(`${path}/trunk_mesh_tsdf.ply`,ok,undefined,no))));if(id!==token){g.dispose();return}rows({baseline,min55,min40});if(mesh){scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose()}compatible(g);if(!g.getAttribute('normal'))g.computeVertexNormals();mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:Boolean(g.getAttribute('color')),color:g.getAttribute('color')?0xffffff:0xb9c5bd,roughness:.88,metalness:0,side:THREE.DoubleSide}));scene.add(mesh);frame(g);loading.hidden=true}catch(e){if(id!==token)return;loading.textContent='Không tải được mesh hoặc metrics';loading.classList.add('error');console.error(e)}}
    document.querySelector('#list').addEventListener('click',e=>{const b=e.target.closest('[data-index]');if(b){selected=Number(b.dataset.index);load()}});document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;load()}));document.querySelector('#rotate').addEventListener('click',e=>{controls.autoRotate=!controls.autoRotate;e.currentTarget.setAttribute('aria-pressed',String(controls.autoRotate));e.currentTarget.textContent=controls.autoRotate?'Đang xoay':'Đã dừng'});document.querySelector('#reset').addEventListener('click',()=>mesh&&frame(mesh.geometry));addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();selected=(selected+(e.key==='ArrowDown'?1:-1)+samples.length)%samples.length;load()}else if(e.key.toLowerCase()==='b'){mode='baseline';load()}else if(e.key==='1'){mode='min55';load()}else if(e.key==='2'){mode='min40';load()}});new ResizeObserver(()=>{const w=viewer.clientWidth,h=viewer.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(h,1);camera.updateProjectionMatrix()}).observe(viewer);function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}renderList();load();animate();
  </script>
</body></html>
